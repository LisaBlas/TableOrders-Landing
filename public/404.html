<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening TableOrders</title>
  </head>
  <body>
    <script>
      (() => {
        const base = '/TableOrders-Landing';
        const route = window.location.pathname.startsWith(base)
          ? window.location.pathname.slice(base.length)
          : '/';
        const destination = `${route}${window.location.search}${window.location.hash}`;
        window.location.replace(`${base}/?redirect=${encodeURIComponent(destination)}`);
      })();
    </script>
  </body>
</html>
